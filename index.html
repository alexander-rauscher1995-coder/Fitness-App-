<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Check-in">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Mein Check-in</title>
<style>
:root{color-scheme:dark;--bg:#0b120e;--card:#142019;--line:#2b4032;--text:#eff7f0;--muted:#a1b2a5;--green:#55e39a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#28563a 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:auto;padding:26px 16px 60px}.brand{font-size:13px;letter-spacing:.15em;color:var(--green);font-weight:800;margin-bottom:8px}h1{font-size:27px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tabs button,.save{border:1px solid var(--line);border-radius:13px;padding:13px;background:#17251c;color:var(--text);font-weight:750;font-size:15px}.tabs button.active,.save{background:var(--green);color:#092014;border-color:var(--green)}
.card{background:linear-gradient(145deg,#18271e,#111b15);border:1px solid var(--line);border-radius:18px;padding:18px}.date{font-size:13px;color:var(--muted);margin-bottom:14px}label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin:0 0 7px}textarea{width:100%;min-height:115px;resize:vertical;padding:13px;background:#0b1510;color:var(--text);border:1px solid #354b3b;border-radius:12px;font:inherit}input[type=file]{width:100%;color:var(--muted);font-size:13px;margin-top:8px}.save{width:100%;margin-top:15px;cursor:pointer}.panel{display:none}.panel.active{display:block}.status{font-size:13px;color:var(--green);min-height:22px;margin-top:10px}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.last{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body><main>
<div class="brand">MEIN CHECK-IN</div>
<h1>Kurz festhalten.</h1>
<p class="sub">Zwei kleine Check-ins. Mehr brauchst du nicht.</p>
<div class="tabs"><button class="active" data-tab="daily">Täglich</button><button data-tab="weekly">Wöchentlich</button></div>
<section id="daily" class="panel active"><div class="card">
<div class="date" id="today"></div><label for="dailyNote">Wie war dein Tag?</label>
<textarea id="dailyNote" placeholder="Ein paar kurze Gedanken …"></textarea>
<button class="save" id="saveDaily">Speichern</button><div class="status" id="dailyStatus"></div><div class="last" id="dailyLast"></div>
</div></section>
<section id="weekly" class="panel"><div class="card">
<div class="date" id="weekDate"></div><label for="weeklyNote">Wie war deine Woche?</label>
<textarea id="weeklyNote" placeholder="Was war schön? Was möchtest du festhalten?"></textarea>
<label for="weeklyPhotos" style="margin-top:16px">Optional ein Foto hinzufügen</label>
<input id="weeklyPhotos" type="file" accept="image/*" multiple>
<div class="preview" id="photoPreview"></div>
<button class="save" id="saveWeekly">Speichern</button><div class="status" id="weeklyStatus"></div><div class="last" id="weeklyLast"></div>
</div></section>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), today=new Date().toLocaleDateString('sv-SE');
const monday=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toLocaleDateString('sv-SE')};
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('de-DE');
let data={daily:{},weekly:{}};
try{data=Object.assign(data,JSON.parse(localStorage.getItem('simple-checkin-v1')||'{}'))}catch(e){}
data.daily=data.daily||{};data.weekly=data.weekly||{};
const dbReq=indexedDB.open('simple-checkin-photos',1);let photoDB=null;
dbReq.onupgradeneeded=()=>dbReq.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});
dbReq.onsuccess=()=>{photoDB=dbReq.result;showLast()};
$('today').textContent=fmt(today);$('weekDate').textContent='Woche ab '+fmt(monday());
function persist(){try{localStorage.setItem('simple-checkin-v1',JSON.stringify(data));return true}catch(e){return false}}
function showLast(){
 const d=data.daily[today];$('dailyLast').textContent=d?'Dein heutiger Eintrag ist gespeichert.':'';
 const w=data.weekly[monday()];$('weeklyLast').textContent=w?'Dein Wochen-Check-in ist gespeichert.':'';
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))}));
$('saveDaily').onclick=()=>{data.daily[today]=$('dailyNote').value.trim();if(persist()){$('dailyStatus').textContent='Gespeichert ✓';showLast()}else $('dailyStatus').textContent='Speicherplatz voll.'};
$('weeklyPhotos').onchange=()=>{const box=$('photoPreview');box.innerHTML='';Array.from($('weeklyPhotos').files||[]).forEach(f=>{if(!f.type.startsWith('image/'))return;const img=document.createElement('img');img.src=URL.createObjectURL(f);box.appendChild(img)})};
$('saveWeekly').onclick=async()=>{const key=monday(),old=data.weekly[key]||{};const entry={note:$('weeklyNote').value.trim(),photoIds:old.photoIds||[]};if(photoDB){for(const file of Array.from($('weeklyPhotos').files||[])){if(!file.type.startsWith('image/'))continue;const id=await new Promise((resolve,reject)=>{const q=photoDB.transaction('photos','readwrite').objectStore('photos').add({week:key,name:file.name,blob:file});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});entry.photoIds.push(id)}}data.weekly[key]=entry;if(persist()){$('weeklyStatus').textContent='Gespeichert ✓';$('weeklyPhotos').value='';$('photoPreview').innerHTML='';showLast()}else $('weeklyStatus').textContent='Speicherplatz voll.'};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
